services:

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "Password123!"
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: ./MonOpsX_api
    env_file:
      - ./MonOpsX_api/.env
    environment:
      MONGO_HOST: mongodb
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

volumes:
  mongodb_data:
