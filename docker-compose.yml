services:
  app:
    build:
      context: ./MonOpsX_app
    image: monopsx-app:1.0.0
    pull_policy: build
    restart: unless-stopped
    environment:
      CI: "1"
      # Développement local web/émulateur avec localhost.
      # Déploiement: remplacez par une URL publique, par exemple https://api.votre-domaine.com.
      # Téléphone physique sur Wi-Fi: localhost pointe vers le téléphone, utilisez une IP LAN ou une URL déployée.
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_GRAFANA_BASE_URL: http://localhost:3000
      EXPO_PUBLIC_GRAFANA_GLOBAL_DASHBOARDS: "Vue globale|/d/monopsx-global/monopsx-global?orgId=1&var-account_id={accountId}"
      EXPO_PUBLIC_GRAFANA_SERVER_DASHBOARDS: "Métriques serveur|/d/monopsx-server/monopsx-server?orgId=1&var-account_id={accountId}&var-server_id={serverId}"
      EXPO_NO_TELEMETRY: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_started
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - 27018:27017
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./MonOpsX_api
    image: monopsx-api:1.0.0
    pull_policy: build
    restart: unless-stopped
    env_file:
      - ./MonOpsX_api/.env
    environment:
      MONGO_HOST: mongodb
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      PREDICTION_ENABLED: ${PREDICTION_ENABLED:-True}
      PREDICTION_MODE: ${PREDICTION_MODE:-mock}
      PREDICTION_HORIZON_DAYS: ${PREDICTION_HORIZON_DAYS:-3}
      PREDICTION_COOLDOWN_HOURS: ${PREDICTION_COOLDOWN_HOURS:-24}
      PREDICTION_METRICS_LIMIT: ${PREDICTION_METRICS_LIMIT:-24}
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Pour des tableaux de bord basés sur l'API, ajoutez une datasource JSON/Infinity
      # dans Grafana et utilisez les URL de l'API MonOpsX depuis le réseau Docker.
      # Les tableaux Grafana doivent recevoir var-account_id depuis l'application.
      # Un acces direct sans var-account_id ne renvoie pas de donnees de compte.
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      api:
        condition: service_started

  ollama:
    image: ollama/ollama:0.9.0
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:0.9.0
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]

volumes:
  mongodb_data:
  grafana_data:
  ollama_data:
